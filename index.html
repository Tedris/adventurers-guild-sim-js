<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adventurers Guild Simulator</title>
  <link rel="stylesheet" href="dist/styles.css">
</head>
<body>
  <div id="game-container">
    <!-- Header bar: gold, day counter, fame -->
    <header id="game-header">
      <h1>Adventurers Guild</h1>
      <div id="header-stats">
        <span id="day-display">Day: 1</span>
        <span id="gold-display">Gold: 0</span>
        <span id="fame-display">Fame: 0</span>
      </div>
    </header>

    <!-- Navigation tabs: Dashboard, Roster, Quest Board, Events, Upgrades -->
    <nav id="game-nav">
      <button class="nav-tab active" data-tab="dashboard">Dashboard</button>
      <button class="nav-tab" data-tab="roster">Roster</button>
      <button class="nav-tab" data-tab="quests">Quest Board</button>
      <button class="nav-tab" data-tab="events">Events</button>
      <button class="nav-tab" data-tab="upgrades">Upgrades</button>
    </nav>

    <!-- Main content area: empty grid, ready for cards -->
    <main id="game-content">
      <!-- adventurer-card-template -->
      <!-- quest-card-template -->
    </main>
  </div>

  <script src="dist/app.js"></script>
</body>
</html>
